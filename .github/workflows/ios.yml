name: iOS build and simulator smoke test
on:
  push:
    branches: [main]
    paths: ['web/**', 'ios/**', 'tools/sync.mjs', 'tools/generate-ios-project.py', 'tools/test-ios-simulator.py', 'tools/test-ios-lan.py', 'tools/test-ios-touch.py', 'tools/ios-lan-probe.js', 'tests/*.test.mjs', '.github/workflows/ios.yml', 'package.json', 'pnpm-lock.yaml']
  pull_request:
    paths: ['web/**', 'ios/**', 'tools/**', 'tests/**', '.github/workflows/ios.yml', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    # 标准 Intel 执行器提供 14 GB 内存，减轻双模拟器在 7 GB ARM 执行器上的启动压力。
    # The standard Intel runner has 14 GB RAM, reducing paired-simulator startup pressure versus 7 GB ARM.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15-intel
    timeout-minutes: 45
    # 触控 Runner 与双机联机分开占用模拟器；同提交运行全部断言。
    # Isolate UI runners from paired LAN simulators while testing every assertion at the same commit.
    strategy:
      fail-fast: false
      matrix:
        check: [touch, lan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select existing Xcode 16 baseline when available
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          choices=[p for p in pathlib.Path('/Applications').glob('Xcode_16*.app') if 'beta' not in p.name.lower()]
          if choices:
              p=max(choices,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))
              with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVELOPER_DIR='+str(p/'Contents/Developer')+'\n')
          PY
      - name: Install build dependencies
        run: npm install --ignore-scripts
      - name: Build compatible game bundle and Xcode project
        run: |
          mkdir -p .local
          node tools/sync.mjs
          python3 tools/generate-ios-project.py
          node --test tests/*.test.mjs
      - name: Build ARM64 iPhoneOS app with iOS 12 deployment target
        run: |
          xcodebuild -project ios/DemonStar.xcodeproj -scheme DemonStar -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath .local/ios-device CODE_SIGNING_ALLOWED=NO build > .local/device-build.log 2>&1
          mkdir -p artifacts/Payload
          cp -R .local/ios-device/Build/Products/Release-iphoneos/DemonStar.app artifacts/Payload/
          cd artifacts && zip -qr DemonStar.ipa Payload
      - name: Build and launch on an existing iPhone simulator
        run: python3 tools/test-ios-simulator.py
      - name: Verify system long presses and game-mode entries on existing iPhone and iPad
        if: matrix.check == 'touch'
        run: python3 tools/test-ios-touch.py
      - name: Verify two-player native LAN on existing iPhone and iPad simulators
        if: matrix.check == 'lan'
        run: python3 tools/test-ios-lan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.check == 'touch' && 'DemonStar-Reborn-iOS' || 'DemonStar-Reborn-iOS-LAN' }}
          path: |
            ${{ matrix.check == 'touch' && 'artifacts/*.ipa' || '' }}
            artifacts/*.png
            artifacts/*.json
            artifacts/*.xcresult
            .local/*build.log
          if-no-files-found: error
          include-hidden-files: true
